name: Sync GitHub Repo to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hf-space:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install HF CLI
        run: pip install -U huggingface_hub

      - name: HF Login
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: echo $HF_TOKEN | hf auth login --token

      - name: Upload files to HF Space
        run: |
          hf upload \
            Amitkarar/Amitkarar/RAG_QA_ASTRADB \
            . \
            --repo-type space \
            --commit-message "Sync from GitHub Actions"
